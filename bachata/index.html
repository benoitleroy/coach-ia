<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D0F14">
<title>Bachata N.S.T</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-cal"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></g>
    <g id="i-timer"><circle cx="12" cy="13" r="8"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="10" y1="2" x2="14" y2="2"/></g>
    <g id="i-lib"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></g>
    <g id="i-flame"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></g>
    <g id="i-bar"><path d="M6.5 6.5 17.5 17.5"/><path d="M21 21l-1-1"/><path d="M3 3l1 1"/><path d="M18 22l4-4"/><path d="M2 6l4-4"/><path d="M3 10l7-7"/><path d="M14 21l7-7"/></g>
    <g id="i-heart"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></g>
    <g id="i-plus"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></g>
    <g id="i-users"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></g>
    <g id="i-moon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></g>
    <g id="i-note"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></g>
    <g id="i-play"><polygon points="5 3 19 12 5 21 5 3"/></g>
    <g id="i-video"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></g>
    <g id="i-chev"><polyline points="9 18 15 12 9 6"/></g>
    <g id="i-pause"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></g>
    <g id="i-stop"><rect x="5" y="5" width="14" height="14" rx="2"/></g>
    <g id="i-run"><path d="M13 4a2 2 0 1 0 4 0 2 2 0 0 0-4 0"/><path d="M4 17l5 1 .75-1.5"/><path d="M15 21l-1-4-3-3 1-6"/><path d="M7 12l2-4 4-1 3 3 3 1"/></g>
  </defs>
</svg>

<!-- ═══ PAGE AUJOURD'HUI ═══ -->
<main id="page-jour" class="page">
  <header class="topbar">
    <button id="btn-prev" class="navbtn" aria-label="Jour précédent"><svg class="ic" style="transform:rotate(180deg)"><use href="#i-chev"/></svg></button>
    <div class="topbar-title">
      <div id="jour-date">…</div>
      <div id="jour-titre" class="muted">…</div>
    </div>
    <button id="btn-next" class="navbtn" aria-label="Jour suivant"><svg class="ic"><use href="#i-chev"/></svg></button>
  </header>
  <div id="jour-contenu"></div>
</main>

<!-- ═══ PAGE CHRONO ═══ -->
<main id="page-chrono" class="page" hidden>
  <div id="chrono-setup">
    <h1>Chrono</h1>
    <div class="mode-grid">
      <button class="mode-btn" data-mode="fortime">For Time<span>compte en avant</span></button>
      <button class="mode-btn" data-mode="amrap">AMRAP<span>compte à rebours</span></button>
      <button class="mode-btn" data-mode="emom">EMOM<span>minutes qui tournent</span></button>
      <button class="mode-btn" data-mode="tabata">Tabata<span>20s / 10s × 8</span></button>
      <button class="mode-btn wide" data-mode="custom">Intervalles<span>travail / repos / tours</span></button>
    </div>
    <div id="chrono-params"></div>
    <button id="btn-start" class="go-big" hidden>GO</button>
  </div>
  <div id="chrono-run" hidden>
    <div id="run-phase">&nbsp;</div>
    <div id="run-time">0:00</div>
    <div id="run-sub">&nbsp;</div>
    <div class="run-controls">
      <button id="btn-pause"><svg class="ic"><use href="#i-pause"/></svg><span>Pause</span></button>
      <button id="btn-stop"><svg class="ic"><use href="#i-stop"/></svg><span>Stop</span></button>
    </div>
  </div>
</main>

<!-- ═══ PAGE WODS ═══ -->
<main id="page-wods" class="page" hidden>
  <h1>Base WOD</h1>
  <div class="wod-filters">
    <input id="wod-search" type="search" placeholder="Rechercher (rameur, burpees…)">
    <div id="wod-sources"></div>
  </div>
  <div id="wod-liste"></div>
</main>

<!-- ═══ PAGE CHARGES ═══ -->
<main id="page-charges" class="page" hidden>
  <h1>Mes charges maxi</h1>
  <p class="muted" style="margin:0 1rem .8rem">Rentre tes 1RM (charge maxi sur 1 rép). Les séances afficheront automatiquement tes charges de travail en kg à côté des pourcentages. Sauvegardé sur ce téléphone.</p>
  <div id="charges-liste"></div>
</main>

<!-- ═══ BOTTOM NAV ═══ -->
<nav class="bottomnav">
  <button data-page="jour" class="active"><svg class="ic"><use href="#i-cal"/></svg>Aujourd'hui</button>
  <button data-page="chrono"><svg class="ic"><use href="#i-timer"/></svg>Chrono</button>
  <button data-page="wods"><svg class="ic"><use href="#i-lib"/></svg>WODs</button>
  <button data-page="charges"><svg class="ic"><use href="#i-bar"/></svg>Charges</button>
</nav>

<script src="js/nst-data.js"></script>
<script src="js/wods-data.js" onerror="console.info('wods absents')"></script>
<script src="js/app.js"></script>
</body>
</html>
